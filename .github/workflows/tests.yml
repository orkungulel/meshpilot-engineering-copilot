name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"  # the minimum supported version
          cache: pip
          cache-dependency-path: pyproject.toml
      # No API key and no embedding model are needed: the tests use a generated
      # PDF, a fake embedder and a fake Claude client.
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
